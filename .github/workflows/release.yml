name: Build signed release APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/campusday-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          mkdir -p release-output
          APK="release-output/Campus-Day-$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "release-output/SIGNING-CERTIFICATE-$VERSION.txt"
          grep -q '299609ae0a8c38f14ebf3443342e9f88bc73b82c8a4e102a08ff34ae69bdd40d' "release-output/SIGNING-CERTIFICATE-$VERSION.txt"
          cd release-output
          sha256sum "Campus-Day-$VERSION.apk" > "SHA256SUMS-$VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release-output/
