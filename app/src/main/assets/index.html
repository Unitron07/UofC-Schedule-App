<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101412" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Campus Day</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      type="file"
      id="file-input"
      accept=".ics,text/calendar,application/ics"
      hidden
    />
    <script src="ical.js"></script>
    <script src="calendar.js"></script>
    <script src="courses.js"></script>
    <script src="day-default.js"></script>
    <script src="academic.js"></script>
    <script src="academic-data.js"></script>
    <script src="academic-state.js"></script>
    <script src="app.js"></script>
    <script src="subjects.js"></script>
  </body>
</html>
